/* ============================================================
   NEXORA v4.1 — Mobile topbar fiable
   Barre d'actions tactile, panneaux en portal et notifications visibles.
   ============================================================ */

/* Les panneaux sortis de la ligne scrollable gardent une position stable
   même quand la topbar est sticky ou que le téléphone change d'orientation. */
.dash-topbar-popover {
  position: fixed;
  z-index: 450;
}
.dash-bell-pop.dash-topbar-popover {
  top: 0;
  right: 12px;
}
.dash-accent-pop.dash-topbar-popover {
  top: 0;
  right: 12px;
}

.bp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 3px 3px 9px 5px;
  margin-bottom: 3px;
  border-bottom: 1px solid var(--d-border);
}
.bp-head b { font-size: 13px; color: var(--d-text); }
.bp-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  border: 1px solid var(--d-border);
  border-radius: 9px;
  color: var(--d-dim);
  background: transparent;
  font: inherit;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}
.bp-close:hover { color: var(--d-text); border-color: var(--d-accent); background: rgba(var(--d-accent-rgb), .12); }

@media (max-width: 700px), (max-width: 900px) and (hover: none) and (pointer: coarse) and (any-pointer: coarse), (hover: none) and (pointer: coarse) and (max-height: 800px) and (any-pointer: coarse) {
  /* Deux lignes lisibles : serveur, puis actions. La ligne d'actions peut
     défiler horizontalement si « Ajouter le bot » est aussi présent, sans
     réduire les boutons ni faire passer la notification hors de l'écran. */
  .dash-topbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: stretch;
    gap: 9px;
    overflow: visible;
  }
  .dash-topbar > .dash-server-card.topbar-pick {
    order: 1;
    grid-column: 1;
    width: 100%;
    min-width: 0;
    max-width: none;
    flex: none;
  }
  .dash-topbar > .dash-topbar-actions {
    order: 2;
    grid-column: 1;
    width: 100%;
    min-width: 0;
    margin: 0;
    flex: none;
    flex-wrap: nowrap;
    align-items: center;
    overflow-x: auto;
    overflow-y: visible;
    padding: 1px 1px 3px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-inline: contain;
  }
  .dash-topbar-actions::-webkit-scrollbar { display: none; }
  .dash-topbar-actions > * { flex: 0 0 auto; }
  .dash-topbar-actions .dash-iconbtn {
    width: 44px;
    min-width: 44px;
    height: 44px;
    border-radius: 13px;
  }
  .dash-topbar-actions .dash-btn { flex: 0 0 auto; min-height: 44px; white-space: nowrap; }
  .dash-topbar-actions .dash-bot-chip { flex: 0 0 auto; min-width: 44px; }
  .dash-accent-wrap { flex: 0 0 auto; }

  /* Sur téléphone, une notification est une vraie feuille flottante. Elle
     reste au-dessus du contenu et de la barre basse, avec une zone de clic
     confortable et une hauteur adaptée aux petits écrans. */
  .dash-bell-pop.dash-topbar-popover {
    top: auto !important;
    left: max(12px, env(safe-area-inset-left)) !important;
    right: max(12px, env(safe-area-inset-right)) !important;
    bottom: calc(78px + env(safe-area-inset-bottom)) !important;
    width: auto;
    max-width: none;
    max-height: 64vh;
    max-height: min(64dvh, 460px);
    border-radius: 18px;
    padding: 10px;
    z-index: 450;
    box-shadow: 0 24px 60px -18px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.04) inset;
    animation: mobileTopbarSheet .2s cubic-bezier(.2,.85,.25,1) both;
  }
  .dash-bell-pop.dash-topbar-popover .bp-list { max-height: none; overflow: visible; }
  .dash-bell-pop.dash-topbar-popover .bp-item { min-height: 42px; padding: 11px 10px; }

  /* Le choix de couleur ne doit pas être coupé par le défilement horizontal
     des actions. Les pastilles deviennent une petite feuille accessible. */
  .dash-accent-pop.dash-topbar-popover {
    top: auto !important;
    left: max(12px, env(safe-area-inset-left)) !important;
    right: max(12px, env(safe-area-inset-right)) !important;
    bottom: calc(78px + env(safe-area-inset-bottom)) !important;
    width: auto;
    max-width: none;
    justify-content: space-around;
    gap: 8px;
    padding: 13px 12px;
    border-radius: 18px;
    z-index: 450;
    box-shadow: 0 24px 60px -18px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.04) inset;
    animation: mobileTopbarSheet .2s cubic-bezier(.2,.85,.25,1) both;
  }
  .dash-accent-pop.dash-topbar-popover .acc-dot {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
  }

  /* Les infobulles hover ne sont pas adaptées au tactile. Les aria-label
     restent disponibles pour les lecteurs d'écran et les boutons sont grands. */
  [data-tip]:hover::after { display: none; }
  .bp-close { width: 36px; height: 36px; flex-basis: 36px; }

  /* La recherche reste utilisable avec le clavier virtuel sans être
     repoussée sous la barre du navigateur. */
  .dash-palette-overlay {
    padding: max(76px, calc(60px + env(safe-area-inset-top))) 12px 16px;
  }
  .dash-palette { max-height: calc(100dvh - 100px); }
}

@keyframes mobileTopbarSheet {
  from { opacity: 0; transform: translateY(12px) scale(.985); }
  to { opacity: 1; transform: none; }
}

@media (max-width: 520px) {
  .dash-topbar { gap: 8px; padding-left: 10px; padding-right: 10px; }
  .dash-topbar-actions { gap: 6px; }
  .dash-topbar-actions .dash-iconbtn { width: 42px; min-width: 42px; height: 42px; }
  .dash-topbar-actions .dash-bot-chip { padding: 6px 8px !important; }
  .dash-topbar-actions .dash-bot-chip img,
  .dash-topbar-actions .dash-bot-chip .chip-fallback { width: 30px !important; height: 30px !important; }
}

@media (prefers-reduced-motion: reduce) {
  .dash-bell-pop.dash-topbar-popover,
  .dash-accent-pop.dash-topbar-popover { animation: none !important; }
}

/* ============================================================
   NEXORA v5.0 — Control Center humain
   Cohérence globale des modules, vue d'ensemble et responsive.
   Cette couche finale conserve toutes les classes historiques et toutes les
   routes existantes : elle ne change que la présentation et les états UI.
   ============================================================ */
:root {
  --d-surface-1: #121a26;
  --d-surface-2: #172335;
  --d-surface-3: #1c2a3d;
  --d-border-strong: rgba(91,112,145,.8);
  --d-radius-card: 18px;
  --d-radius-control: 12px;
  --d-focus-ring: 0 0 0 4px rgba(var(--d-accent-rgb), .16);
  --d-content-max: 1280px;
}

.dash-main { padding-top: 25px; }
#dash-content { max-width: var(--d-content-max); margin: 0 auto; }

/* En-tête partagé : chaque module possède le même langage visuel. */
.dash-module-header {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  align-items: center;
  gap: 15px;
  min-height: 76px;
  padding: 3px 2px 18px;
  margin-bottom: 22px;
  border-bottom: 1px solid rgba(49,65,88,.72);
  position: relative;
}
.dash-module-header::after {
  width: 150px;
  height: 2px;
  background: linear-gradient(90deg, var(--d-accent), var(--d-accent2), transparent);
}
.dash-module-header .m-icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  box-shadow: 0 13px 28px -18px var(--d-glow), inset 0 1px 0 rgba(255,255,255,.08);
}
.module-header-copy { min-width: 0; }
.module-header-copy h1 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.module-header-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}
.module-scope, .module-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  padding: 6px 10px;
  border: 1px solid var(--d-border-soft);
  border-radius: 999px;
  color: #a7b5c9;
  background: rgba(255,255,255,.035);
  font-size: 10.5px;
  font-weight: 800;
  white-space: nowrap;
}
.module-status.is-online { color: #7ee5a4; border-color: rgba(73,209,125,.28); background: rgba(73,209,125,.07); }
.module-status.is-offline { color: #ff9da3; border-color: rgba(240,108,117,.3); background: rgba(240,108,117,.07); }
.module-scope-dot, .ov-health-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: #8291a8;
}
.module-scope-dot.is-online, .ov-health-dot.is-online { background: var(--d-green); box-shadow: 0 0 0 4px rgba(73,209,125,.1), 0 0 12px rgba(73,209,125,.45); }
.module-scope-dot.is-offline, .ov-health-dot.is-offline { background: var(--d-red); box-shadow: 0 0 0 4px rgba(240,108,117,.1); }

/* Cartes communes : rythme, en-tête et focus sans modifier les modules. */
.dash-card[data-dash-card] {
  border-radius: var(--d-radius-card);
  border-color: var(--d-border-soft);
  background:
    linear-gradient(145deg, rgba(255,255,255,.035), transparent 43%),
    var(--d-surface-1);
  box-shadow: 0 1px 0 rgba(255,255,255,.045) inset, 0 18px 42px -34px rgba(0,0,0,.95);
}
.dash-card[data-dash-card] .card-head {
  min-height: 34px;
  padding-bottom: 11px;
  margin-bottom: 15px;
  border-bottom: 1px solid rgba(49,65,88,.62);

.module-header-lead { position: relative; }
.module-back { min-height: var(--d-control-height); }
.module-back:hover { box-shadow: 0 10px 22px -18px var(--d-glow); }
.module-header-meta { max-width: 320px; }

/* Les cartes se lisent comme des panneaux de travail, pas comme des tuiles. */
.dash-card[data-dash-card] { box-shadow: var(--d-shadow-soft), inset 0 1px 0 rgba(255,255,255,.045); }
.dash-card[data-dash-card]:focus-within { border-color: rgba(129,144,255,.55); box-shadow: 0 0 0 3px rgba(113,130,246,.09), var(--d-shadow-soft); }
.dash-card[data-dash-card] .card-heading h3 { line-height: 1.3; }
.dash-card[data-dash-card] .desc { line-height: 1.55; }
.dash-card[data-dash-card] > .dash-btn:last-child { margin-top: 5px; }

/* Alignement des actions dans les cartes sans imposer une structure aux
   anciens modules : les styles ne s'activent que sur les vrais groupes. */
.dash-actions, .module-actions, .form-actions {
  display: flex;
  align-items: center;
  gap: var(--d-space-2);
  flex-wrap: wrap;
}
.dash-actions .dash-btn, .module-actions .dash-btn, .form-actions .dash-btn { flex: 0 0 auto; }

/* Retours et erreurs : toujours deux sorties claires. */
.dash-state-card .state-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.dash-state-card .state-actions .dash-btn { min-width: 104px; }

/* Tableaux : surface stable lorsque la liste défile. */
.dash-table-wrap { box-shadow: inset 0 1px 0 rgba(255,255,255,.035); }
.dash-table-wrap .dash-table thead th { position: sticky; top: 0; z-index: 1; }

/* Navigation basse plus nette sur les appareils tactiles. */
.dash-bnav { padding-left: max(5px, env(safe-area-inset-left)); padding-right: max(5px, env(safe-area-inset-right)); }
.bnav-item { min-width: 0; }
.bnav-item:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(113,130,246,.25); }

/* Accent visible uniquement à l'endroit utile. */
.dash-side-brand-status { transition: box-shadow .2s ease, background .2s ease; }
.dash-side-brand-status[title*="hors"] { background: var(--d-red); box-shadow: 0 0 0 4px rgba(240,108,117,.1), 0 0 13px rgba(240,108,117,.4); }

html.hx-light .dash-card[data-dash-card]::after { background: linear-gradient(90deg, rgba(95,112,220,.2), transparent 64%); }
html.hx-light .dash-table-wrap { border-color: #d9e1ef; box-shadow: inset 0 1px 0 rgba(70,85,135,.05); }
html.hx-light .dash-table-wrap .dash-table thead th { background: #f7f9fd; }

@media (max-width: 700px), (max-width: 900px) and (hover: none) and (pointer: coarse) and (any-pointer: coarse), (hover: none) and (pointer: coarse) and (max-height: 800px) and (any-pointer: coarse) {
  .dash-module-header { min-height: 70px; }
  .module-header-meta { max-width: none; }
  .dash-state-card .state-actions { width: 100%; }
  .dash-state-card .state-actions .dash-btn { flex: 1; min-width: 0; }
  .dash-actions, .module-actions, .form-actions { align-items: stretch; flex-direction: column; }
  .dash-actions .dash-btn, .module-actions .dash-btn, .form-actions .dash-btn { width: 100%; justify-content: center; }
}

@media (max-width: 520px) {
  .dash-module-header { min-height: 68px; }
  .module-back { width: 38px; padding-left: 8px; padding-right: 8px; }
  .dash-card[data-dash-card] .card-head { padding-bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .dash-side-brand-status, .dash-card[data-dash-card]:focus-within { transition: none !important; }
}

/* ============================================================
   NEXORA v9.0 — Slate & Clay
   Refonte visuelle inspirée des panels Discord modernes :
   surfaces calmes, hiérarchie nette, accent argile et contrôles plats.
   Les routes, données et identifiants des modules restent inchangés.
   ============================================================ */
:root {
  --d-bg: #36393f;
  --d-side: #2b2d31;
  --d-card: #36393f;
  --d-card2: #2b2d31;
  --d-border: #202225;
  --d-border-soft: #4f545c;
  --d-border-strong: #72767d;
  --d-text: #f2f3f5;
  --d-dim: #b5bac1;
  --d-accent: #e07a5f;
  --d-accent2: #c95b49;
  --d-green: #57f287;
  --d-red: #ed4245;
  --d-yellow: #faa61a;
  --d-glow: rgba(224,122,95,.28);
  --d-radius-card: 6px;
  --d-radius-control: 4px;
  --d-surface-1: #36393f;
  --d-surface-2: #40444b;
  --d-surface-3: #2b2d31;
  --d-focus-ring: 0 0 0 2px rgba(224,122,95,.28);
  --d-content-max: 1240px;
  color-scheme: dark;
}

/* Le dashboard prend toute la largeur disponible, comme un vrai panel. */
.bot-shell.dashboard-shell-host {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
}
body:has(.dashboard-shell-host),

}

  box-shadow: none;
}
body:has(.dashboard-shell-host) .navbar .logo-row { color: #f2f3f5; }
body:has(.dashboard-shell-host) .navbar .logo {
  width: 34px;
  height: 34px;
  border: 2px solid #e07a5f;
  border-radius: 50%;
  background: #202225;
  box-shadow: none;
}
body:has(.dashboard-shell-host) .navbar .btn {
  min-height: 36px;
  border-radius: 4px;
  color: #f2f3f5;
  background: transparent;
  border-color: #4f545c;
  box-shadow: none;
}

}
.dashboard-shell-host .dash-side {

.dashboard-shell-host .dash-side::before { display: none; }
.dashboard-shell-host .dash-side > * { position: relative; z-index: 1; }

/* Marque centrée et statuts discrets, à la manière d'un panel de bot. */
.dashboard-shell-host .dash-side-brand {

/* ============================================================

   🏠 Accueil — Refonte Argile (v158)
   Hero en dégradé d'accent, actions rapides en cartes à tuiles,
   cohérence PC / mobile avec le reste du panel.
   ============================================================ */

/* Hero : panneau de bienvenue signature Optimus Prime */
.dashboard-shell-host .ov-welcome-panel {
  position: relative;
  border: 1px solid rgba(var(--d-accent-rgb), .32);
  border-radius: 18px;
  background:
    radial-gradient(520px 210px at 97% -30%, rgba(var(--d-accent-rgb), .2), transparent 70%),
    radial-gradient(430px 200px at 0% 135%, rgba(var(--d-accent-rgb), .11), transparent 72%),
    linear-gradient(150deg, rgba(255,255,255,.05), transparent 55%),
    var(--d-card);
  box-shadow: 0 24px 55px -35px var(--d-glow), inset 0 1px 0 rgba(255,255,255,.07);
  overflow: hidden;
}
.dashboard-shell-host .ov-welcome-panel::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--d-accent), var(--d-accent2), transparent 88%);
}
.dashboard-shell-host .ov-welcome-panel .ov-server-avatar {
  border-radius: 16px;
  border: 2px solid rgba(var(--d-accent-rgb), .45);
  background: linear-gradient(145deg, var(--d-accent), var(--d-accent2));
  box-shadow: 0 12px 26px -12px var(--d-glow);
}
.dashboard-shell-host .ov-welcome-panel .ov-eyebrow { color: var(--d-accent); }
.dashboard-shell-host .ov-welcome-panel .ov-intro-copy h2 {
  font-size: 23px; font-weight: 750; letter-spacing: -.4px; white-space: normal;
}
.dashboard-shell-host .ov-welcome-panel .ov-intro-copy p { color: var(--d-dim); font-size: 12.5px; }
.dashboard-shell-host .ov-welcome-panel .ov-intro-health {
  border-radius: 12px;
  border-color: rgba(73,209,125,.28);
  background: rgba(73,209,125,.08);
  padding: 10px 14px;
}
.dashboard-shell-host .ov-welcome-settings {
  min-height: 40px; padding: 8px 14px; border-radius: 11px; cursor: pointer;
  border: 1px solid rgba(var(--d-accent-rgb), .45);
  background: rgba(var(--d-accent-rgb), .1);
  color: var(--d-text); font-weight: 700; font-size: 12px;
  transition: .15s;
}
.dashboard-shell-host .ov-welcome-settings:hover {
  background: linear-gradient(135deg, var(--d-accent), var(--d-accent2));
  border-color: transparent; color: #fff;
  box-shadow: 0 8px 18px -8px var(--d-glow);
}
.dashboard-shell-host .ov-welcome-settings span { color: inherit; }

/* Actions rapides : cartes à tuiles d'icônes façon panel pro */
.dashboard-shell-host .ov-quick-actions {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--d-border);
  border-radius: 16px;
  background: rgba(20,21,31,.55);
}
.dashboard-shell-host .ov-quick-label {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 8px;
  min-height: 20px; padding: 0 2px;
  color: var(--d-dim); font-size: 10px; font-weight: 900;
  letter-spacing: 1px; text-transform: uppercase;
}
.dashboard-shell-host .ov-quick-action {
  display: flex; align-items: center; gap: 11px;
  min-height: 58px; padding: 9px 12px;
  border: 1px solid var(--d-border);
  border-radius: 13px;
  color: var(--d-dim); background: var(--d-card);
  font-size: 12px; font-weight: 700; text-align: left;
}
.dashboard-shell-host .ov-quick-action > span {
  width: 28px; height: 28px; flex: 0 0 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 11px; font-size: 17px;
  background: rgba(var(--d-accent-rgb), .12);
  transition: .15s;
}
.dashboard-shell-host .ov-qa-txt { min-width: 0; flex: 1; }
.dashboard-shell-host .ov-quick-action b {
  display: block; color: var(--d-text); font-size: 12.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dashboard-shell-host .ov-quick-action small { display: block; font-size: 10.5px; font-weight: 500; margin-top: 1px; }
.dashboard-shell-host .ov-quick-action i { margin-left: auto; color: var(--d-dim); font-style: normal; font-size: 14px; transition: .15s; }
.dashboard-shell-host .ov-quick-action:hover {
  transform: translateY(-2px);
  border-color: rgba(var(--d-accent-rgb), .5);
  background: linear-gradient(150deg, rgba(var(--d-accent-rgb), .09), transparent 62%), var(--d-card);
  box-shadow: 0 12px 26px -18px var(--d-glow);
}
.dashboard-shell-host .ov-quick-action:hover > span {
  background: linear-gradient(135deg, var(--d-accent), var(--d-accent2));
  box-shadow: 0 6px 14px -6px var(--d-glow);
}
.dashboard-shell-host .ov-quick-action:hover i { color: var(--d-accent); }

/* Étapes de configuration : tuiles numérotées en dégradé d'accent */
.dashboard-shell-host .hero-step .hs-num {
  background: linear-gradient(135deg, var(--d-accent), var(--d-accent2));
  box-shadow: 0 4px 10px -4px var(--d-glow);
}
.dashboard-shell-host .hero-step:hover { border-color: rgba(var(--d-accent-rgb), .5); }

/* Cartes de l'accueil : arrondis et bordures harmonisés */
.dashboard-shell-host .ov-checklist-card,
.dashboard-shell-host .ov-home-side-section {
  border: 1px solid var(--d-border);
  border-radius: 16px;
  background: linear-gradient(150deg, rgba(255,255,255,.03), transparent 58%), var(--d-card);
}
.dashboard-shell-host .ov-progress-value {
  background: linear-gradient(90deg, var(--d-accent), var(--d-accent2));
}
.dashboard-shell-host .ov-side-heading b { color: var(--d-text); }

/* 📱 Mobile : 2 colonnes d'actions rapides, hero compact */
@media (max-width: 700px) {
  .dashboard-shell-host .ov-quick-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px; }
  .dashboard-shell-host .ov-quick-action { min-height: 62px; }
  .dashboard-shell-host .ov-welcome-panel .ov-intro-copy h2 { font-size: 19px; }
}

/* ============================================================
   🧷 Lignes de réglage façon Discord/DraftBot (v159)
   Chaque réglage : libellé à gauche, contrôle à droite.
   Sur mobile, la ligne se replie en pile lisible.
   ============================================================ */
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px; padding: 13px 2px;
  border-bottom: 1px solid rgba(255,255,255,.055);
}
.setting-row:last-child { border-bottom: none; padding-bottom: 4px; }
.setting-row > .dash-label {
  /* 🔧 AUDIT v186 : « flex:1 » (base 0) laissait l'étiquette rétrécir
     jusqu'à 11px dans les lignes étroites → textes invisibles.
     Base « auto » + minimum : l'étiquette garde une taille lisible
     et passe sur 2 lignes si besoin. */
  flex: 1 1 auto; min-width: 100px; margin: 0 !important;
  font-size: 13.5px; font-weight: 650; color: var(--d-text);
  overflow-wrap: anywhere;
}
/* v245 — min-width: 0 est indispensable. Un élément flex a par défaut
   min-width: auto, c'est-à-dire la largeur de son contenu : il refuse donc de
   rétrécir sous cette taille. Un <select> dont la plus longue option fait
   300 px ne se compressait pas et faisait déborder la ligne. Mesuré à 768 px :
   +57 px de débordement sur le barème de Modération, +43 px sur un champ de
   l'onglet Bot. Sans min-width: 0, flex-shrink ne sert à rien. */
.setting-row > .dash-select, .setting-row > input.dash-input { width: 300px; flex: 0 1 300px; min-width: 0; }
/* Les champs numériques peuvent rétrécir davantage (ils restent utilisables) */
.setting-row > input.dash-input[type="number"] { min-width: 84px; }
.setting-row > textarea.dash-input { flex: 1 1 100%; min-height: 90px; }
.setting-row > label.switch { flex-shrink: 0; }
.setting-row > .dash-roles-multi, .setting-row > .discord-multi-host, .setting-row > .dd-host { flex: 0 1 340px; max-width: 340px; min-width: 0; }
.setting-row > div { flex: 0 1 300px; display: flex; gap: 8px; align-items: center; min-width: 0; }

/* 📌 Sélecteur « salons à détailler » (bienvenue/départ) — éditeur multi-lignes.
   Toujours en bloc PLEIN LARGEUR sous son libellé : il ne doit jamais être
   compressé en colonne « libellé → contrôle » (lignes empilées + débordement). */
.dash-channelsmulti {
  display: block; width: 100%; min-width: 0; margin-top: 4px;
}
.cm-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px dashed var(--d-border);
}
.cm-row:last-of-type { border-bottom: none; }
.cm-name {
  flex: 0 1 auto; min-width: 0; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13px; color: var(--d-text);
}
.cm-row > .cm-label {
  flex: 1 1 240px; min-width: 0; height: 38px; padding: 4px 10px;
}
.cm-row > .cm-remove { flex: 0 0 auto; padding: 7px 12px; }
.cm-add-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px;
}
.cm-add-row > .dd-host, .cm-add-row > select.dash-select {
  flex: 1 1 200px; min-width: 0;
}
.cm-add-row > .dash-btn { flex: 0 0 auto; }
@media (max-width: 640px) {
  .cm-row > .cm-label { flex-basis: 100%; }
  .cm-add-row > .dd-host, .cm-add-row > select.dash-select { flex-basis: 100%; }
}

/* v332 — Lives : ajouter un compte, lisible sur mobile */
.lv-add-row {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 8px;
}
.lv-add-row > .dash-input,
.lv-add-row > .dd-host,
.lv-add-row > select.dash-select {
  flex: 1 1 160px;
  min-width: 0;
  max-width: 100%;
}
.lv-add-row > .dash-btn { flex: 0 0 auto; }
@media (max-width: 700px) {
  .lv-add-row { flex-direction: column; }
  .lv-add-row > .dash-input,
  .lv-add-row > .dd-host,
  .lv-add-row > select.dash-select,
  .lv-add-row > .dash-btn {
    flex: 1 1 auto;
    width: 100%;
    max-width: 100%;
  }
}
@media (min-width: 700px) and (hover: none) and (pointer: coarse), (max-width: 640px) {
  .cm-row { gap: 6px; }
}

/* Pied de carte : actions regroupées à droite */
.card-actions {
  display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  padding-top: 14px; margin-top: 10px;
  border-top: 1px solid rgba(255,255,255,.055);
}
/* v245 — 40 px, comme tout .dash-btn (règle générale ligne ~924).
   À 38 px, ce sélecteur plus spécifique écrasait la hauteur normale et les
   boutons de pied de carte étaient PLUS PETITS que les autres. Or
   layoutSettingRows déplace automatiquement les boutons en fin de carte dans
   .card-actions : 47 boutons du tableau de bord se retrouvaient donc à 38 px,
   sous les 40 px retenus en v244. Mesuré dans Chromium à 360 px. */
.card-actions .dash-btn { min-height: 40px; }

/* 📱 Mobile : chaque ligne se replie en pile (libellé puis contrôle) */
@media (max-width: 700px) {
  .setting-row { flex-direction: column; align-items: stretch; gap: 9px; }
  .setting-row > .dash-select, .setting-row > input.dash-input,
  .setting-row > .dash-roles-multi, .setting-row > .discord-multi-host,
  .setting-row > .dd-host, .setting-row > div { width: 100%; flex: 1 1 auto; max-width: none; }
  .card-actions { justify-content: stretch; }
  .card-actions .dash-btn { flex: 1; }
}

/* ============================================================
   🗂️ Grille de sélection de serveurs + hero à bannière (v160)
   ============================================================ */

/* --- Grille de sélection (modale) --- */
.sp-picker { padding: 20px 22px; min-width: 0; }
.sp-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.sp-head-copy { flex: 1; min-width: 0; }
.sp-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -.4px; color: #f5f7fc; }
.sp-head p { color: var(--d-dim); font-size: 12.5px; margin-top: 3px; }
.sp-search {
  min-height: 42px; padding: 8px 14px; min-width: 220px; flex: 0 1 260px;
  background: rgba(0,0,0,.3); border: 1px solid var(--d-border); border-radius: 11px;
  color: var(--d-text); font-family: inherit; font-size: 13px; outline: none;
  transition: .15s;
}
.sp-search:focus { border-color: var(--d-accent); box-shadow: 0 0 0 4px rgba(var(--d-accent-rgb), .16); }
.sp-close {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
  background: rgba(255,255,255,.05); border: 1px solid var(--d-border);
  color: var(--d-dim); font-size: 18px; line-height: 1; transition: .13s;
}
.sp-close:hover { color: #fff; background: rgba(237,66,69,.15); border-color: rgba(237,66,69,.45); }
.sp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.sp-card {
  position: relative; display: block; padding: 0; overflow: hidden;
  border: 1px solid var(--d-border); border-radius: 15px;
  background: var(--d-card); cursor: pointer; text-align: left; font-family: inherit;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.sp-card:hover {
  transform: translateY(-2px);
  border-color: rgba(var(--d-accent-rgb), .55);
  box-shadow: 0 16px 32px -20px var(--d-glow);
}
.sp-card.is-current { border-color: rgba(var(--d-accent-rgb), .7); box-shadow: inset 0 0 0 1px rgba(var(--d-accent-rgb), .45); }
.sp-banner {
  display: block; position: relative; height: 56px;
  background: linear-gradient(135deg, rgba(var(--d-accent-rgb), .38), rgba(var(--d-accent-rgb), .12)), var(--d-card2);
  background-size: cover; background-position: center;
}
.sp-fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-weight: 900; color: rgba(255,255,255,.55); letter-spacing: 1px;
}
.sp-current-tag, .sp-ro {
  position: absolute; top: 10px; right: 10px;
  padding: 4px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
  backdrop-filter: blur(6px);
}
.sp-current-tag { background: rgba(var(--d-accent-rgb), .9); color: #fff; }
.sp-ro { background: rgba(0,0,0,.55); color: #ffd166; border: 1px solid rgba(255,209,102,.35); }
.sp-body { display: flex; align-items: center; gap: 10px; padding: 4px 12px 12px; }
.sp-ico {
  width: 38px; height: 38px; flex-shrink: 0; margin-top: -22px; position: relative;
  border-radius: 13px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--d-accent), var(--d-accent2));
  border: 3px solid var(--d-card); color: #fff; font-weight: 800; font-size: 17px;
  box-shadow: 0 8px 18px -10px var(--d-glow);
}
.sp-ico img { width: 100%; height: 100%; object-fit: cover; }
.sp-txt { flex: 1; min-width: 0; }
.sp-txt b {
  display: block; font-size: 14px; font-weight: 750; color: var(--d-text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sp-txt small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--d-dim); }
.sp-mark {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(var(--d-accent-rgb), .12); color: var(--d-accent);
  font-size: 14px; font-weight: 800; transition: .13s;
}
.sp-card:hover .sp-mark { background: linear-gradient(135deg, var(--d-accent), var(--d-accent2)); color: #fff; }

/* --- Hero de l'accueil avec bannière du serveur --- */
.ov-hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background-size: cover; background-position: center 35%;
  opacity: .38; filter: saturate(1.15);
}
.ov-hero-bg::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(14,15,21,.1) 0%, rgba(14,15,21,.55) 55%, rgba(14,15,21,.92) 100%);
}
.dashboard-shell-host .ov-welcome-panel.has-banner { min-height: 176px; }
.dashboard-shell-host .ov-welcome-panel.has-banner > *:not(.ov-hero-bg) { position: relative; z-index: 1; }
.dashboard-shell-host .ov-welcome-panel.has-banner .ov-intro-copy h2,
.dashboard-shell-host .ov-welcome-panel.has-banner .ov-eyebrow { text-shadow: 0 2px 14px rgba(0,0,0,.55); }
.ov-hero-stats {
  grid-column: 1 / -1; position: relative; z-index: 1;
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
}
.ov-hero-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: 11px;
  background: rgba(12,13,20,.6); border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(6px);
  font-size: 12px; color: var(--d-text);
}
.ov-hero-chip span { font-size: 14px; }
.ov-hero-chip b { font-weight: 800; }
/* v244 — Taille explicite. Sans elle, le navigateur appliquait le 80 % par
   défaut de <small> sur un parent à 12 px, soit 9,583 px : du texte illisible
   obtenu par accident, pas par choix. */
.ov-hero-chip small { color: var(--d-dim); font-weight: 550; font-size: 11px; }

/* 📱 Mobile : une seule colonne de cartes, recherche pleine largeur */
@media (max-width: 700px) {
  .sp-picker { padding: 16px 14px; }
  .sp-head { flex-wrap: wrap; }
  .sp-search { flex: 1 1 100%; min-width: 0; }
  .sp-grid { grid-template-columns: 1fr; }
  .ov-hero-stats { gap: 6px; }
  .ov-hero-chip { padding: 6px 10px; font-size: 11.5px; }
}

/* ============================================================
   🧱 Embed Builder (v168) — éditeur + aperçu Discord fidèle
   ============================================================ */
.eb-wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 14px; }
.eb-editor-col { display: grid; gap: 16px; }
.eb-preview-col { display: grid; gap: 16px; position: sticky; top: 12px; }
.eb-vars { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.eb-vars-lbl { font-size: 11.5px; color: var(--d-text-dim); }
.eb-var {
  padding: 3px 8px; border-radius: 6px; font-size: 11.5px; cursor: default;
  background: rgba(224,122,95,.1); border: 1px solid rgba(224,122,95,.28); color: var(--d-accent);
}
.eb-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.eb-color-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.eb-color-row input[type=color] { width: 42px; height: 34px; border: 1px solid var(--d-border); border-radius: 8px; background: var(--d-panel2); padding: 3px; cursor: pointer; }
.eb-preset { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; transition: transform .15s; }
.eb-preset:hover { transform: scale(1.18); }
.eb-btn-add { margin-top: 10px; }
.eb-btnrow { display: grid; grid-template-columns: 58px minmax(0,1fr) 110px 42px; gap: 8px; margin-bottom: 8px; align-items: center; }
.eb-btnrow.has-url { grid-template-columns: 58px minmax(0,1fr) 110px 42px; }
.eb-btnrow .eb-b-url { grid-column: 1 / -1; }
.eb-tpl-save { display: flex; gap: 8px; margin-bottom: 12px; }
.eb-tpl-save .dash-input { flex: 1; min-width: 0; }
.eb-tpl-empty { color: var(--d-text-dim); font-size: 12.5px; padding: 10px 2px; }
.eb-tpl-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border: 1px solid var(--d-border); border-radius: 10px; margin-bottom: 7px; background: var(--d-panel2); }
.eb-tpl-copy b { display: block; font-size: 13px; }
.eb-tpl-copy small { color: var(--d-text-dim); font-size: 11px; }
.eb-tpl-actions { display: flex; gap: 6px; flex-shrink: 0; }
.eb-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.eb-json pre { max-height: 400px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }

/* --- L'aperçu : reconstitution fidèle d'un message Discord --- */
.eb-discord { background: #313338; border-radius: 8px; padding: 16px; }
.eb-dmsg { display: flex; gap: 12px; }
.eb-dava {
  width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
  background: linear-gradient(135deg, var(--d-accent), var(--d-accent2));
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 17px;
}
.eb-dbody { flex: 1; min-width: 0; }
.eb-dhead { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.eb-dhead b { color: #f2f3f5; font-size: 14.5px; }
.eb-dtag { padding: 1.5px 5px; border-radius: 4px; background: #5865F2; color: #fff; font-size: 8.5px; font-weight: 800; letter-spacing: .4px; }
.eb-dtime { color: #949ba4; font-size: 11px; }
.eb-dcontent { color: #dbdee1; font-size: 14px; line-height: 1.5; margin-top: 2px; word-wrap: break-word; }
.eb-mention { background: rgba(88,101,242,.3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; }
.eb-embed {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px;
  background: #2b2d31; border-left: 4px solid #e07a5f; border-radius: 4px;
  padding: 12px 14px; margin-top: 8px; max-width: 520px;
}
.eb-e-main { min-width: 0; }
.eb-e-author { color: #f2f3f5; font-size: 13px; font-weight: 600; margin-bottom: 3px; }

/* ══════════════════════════════════════════════════════════════════
   ▼ v170 — Indicateur « la liste continue en dessous »
   Retour utilisateur : les listes défilables (sidebar, tiroir modules)
   semblaient coupées net → les modules du bas paraissaient « cachés ».
   Ce bouton colle au bas de la zone visible et y amène d'un toucher.
   ══════════════════════════════════════════════════════════════════ */
.scroll-hint {
  position: sticky; bottom: 0; left: 0; right: 0; z-index: 5;
  display: none; align-items: center; justify-content: center;
  width: 100%; margin: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  border: 0; border-radius: 0;
  color: #f2f3f5;
  background: linear-gradient(180deg, rgba(20, 21, 31, .82), #14151f 62%);
  font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .4px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.scroll-hint.on { display: flex; }
.scroll-hint:hover { color: #fff; }
html.hx-light .scroll-hint { color: #23252d; background: linear-gradient(180deg, rgba(242, 243, 245, .88), #f2f3f5 62%); }

/* ════════════════════════════════════════════════════════════════
   🔧 AUDIT UI v186 — correctifs de débordements (mesurés au pixel)
   Audit programmatique : 375px + 1440px × thèmes clair/sombre,
   18 modules + picker + grille de serveurs.
   ════════════════════════════════════════════════════════════════ */

/* 1️⃣ Scroll horizontal de 2px sur mobile : à ≤520px le contenu n'a
   que 10px de marge interne mais d'anciens blocs imposent encore
   -12px à la topbar → elle dépasse de 2px de chaque côté.
   Ce bloc, placé en FIN de fichier, gagne la cascade. */
@media (max-width: 520px) {
  .dash-main,
  .dashboard-shell-host .dash-main { padding-left: 10px; padding-right: 10px; }
  .dash-topbar,
  .dashboard-shell-host .dash-topbar {
    margin-left: -10px;
    margin-right: -10px;
    padding-left: 10px;
    padding-right: 10px;
  }
}

/* 2️⃣ Cloche 🔔 rognée : .bell-badge { display:inline-flex } écrasait
   l'attribut hidden → le badge vide prenait de la place. */
.bell-badge[hidden] { display: none !important; }

/* 3️⃣ Pied de carte (.card-actions) dans les cartes en grille : il
   atterrissait dans la colonne de l'icône (36px) → bouton « Ouvrir → »
   écrasé. Il doit traverser toute la carte, et un bouton ne rétrécit
   jamais sous la taille de son texte. */
.dash-card > .card-actions { grid-column: 1 / -1; }
.card-actions .dash-btn { flex-shrink: 0; white-space: nowrap; max-width: 100%; }

/* 4️⃣ Grille « avertissements » : 3 colonnes trop étroites entre 521
   et 1100px (étiquettes écrasées) → 2 colonnes, puis 1 sur mobile. */
@media (max-width: 1100px) and (min-width: 521px) {
  .am-warning-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* 5️⃣ Boutons d'action sur mobile : « flex:1 » (base 0) donnait à chaque
   bouton une part égale de la ligne, plus étroite que son texte.
   Base « auto » : chaque bouton garde au moins la largeur de son
   libellé, les autres passent à la ligne (flex-wrap). */
@media (max-width: 700px) {
  .card-actions .dash-btn { flex: 1 1 auto; }
}

/* ============================================================
   ✨ HOXERA ULTRA PRO v194 — Phase 2 : finitions UX complètes
   Couche purement additive : aucun sélecteur existant n'est retiré.
   1) Design tokens     2) Accessibilité (focus visible partout)
   3) Hiérarchie        4) Micro-interactions
   5) États vides       6) Responsive fin     7) Mode clair
   ============================================================ */

/* ---------- 1. Design tokens ---------- */
.dashboard-shell-host {
  --dp-radius-card: 16px;
  --dp-radius-ctl: 12px;
  --dp-gap: 18px;
  --dp-shadow-card: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -18px rgba(0,0,0,.65);
  --dp-shadow-card-hover: 0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px -20px rgba(0,0,0,.75);
  --dp-shadow-pop: 0 24px 70px -24px rgba(0,0,0,.9);
  --dp-ring: rgba(var(--d-accent-rgb), .45);
  --dp-transition: .18s cubic-bezier(.2,.8,.25,1);
}

/* ---------- 2. Accessibilité : focus visible clair sur TOUT ---------- */
/* (neutralise l'ancienne règle « outline: none » des boutons/sélecteurs) */
.dashboard-shell-host .dash-btn:focus-visible,
.dashboard-shell-host .dash-iconbtn:focus-visible,
.dashboard-shell-host .dash-select:focus-visible,
.dashboard-shell-host .dash-input:focus-visible,
.dashboard-shell-host textarea.dash-input:focus-visible,
.dashboard-shell-host .dash-side-item:focus-visible,
.dashboard-shell-host .dash-mobile-navbtn:focus-visible,
.dashboard-shell-host .bnav-item:focus-visible,
.dashboard-shell-host .module-back:focus-visible,
.dashboard-shell-host .dash-server-card:focus-visible,
.dashboard-shell-host .x-btn:focus-visible,
.dashboard-shell-host .switch input:focus-visible + .slider,
.dashboard-shell-host .acc-dot:focus-visible,
.dashboard-shell-host .bp-close:focus-visible {
  outline: 3px solid var(--dp-ring) !important;
  outline-offset: 2px;
  border-radius: 8px;
}

/* ---------- 3. Hiérarchie : cartes, stats, tableaux ---------- */
.dashboard-shell-host .dash-card {
  border-radius: var(--dp-radius-card);
  box-shadow: var(--dp-shadow-card);
  transition: transform var(--dp-transition), border-color var(--dp-transition), box-shadow var(--dp-transition);
}
.dashboard-shell-host .dash-card:hover {
  transform: translateY(-2px);
  border-color: rgba(var(--d-accent-rgb), .38);
  box-shadow: var(--dp-shadow-card-hover);
}
.dashboard-shell-host .dash-card h3 { font-size: 15.5px; letter-spacing: -.2px; }

.dashboard-shell-host .dash-stat {
  border-radius: var(--dp-radius-card);
  box-shadow: var(--dp-shadow-card);
}
.dashboard-shell-host .dash-stat .val { font-size: 26px; letter-spacing: -.6px; }
.dashboard-shell-host .dash-stat .lbl { font-size: 12px; font-weight: 650; letter-spacing: .2px; text-transform: uppercase; opacity: .85; }

.dashboard-shell-host .dash-table th { font-size: 10.5px; letter-spacing: .8px; }
.dashboard-shell-host .dash-table tbody tr { transition: background var(--dp-transition); }
.dashboard-shell-host .dash-table tbody tr:hover { background: rgba(var(--d-accent-rgb), .055); }
.dashboard-shell-host .dash-table td { font-size: 13.5px; }

/* ---------- 4. Micro-interactions ---------- */
.dashboard-shell-host .dash-side-item { transition: background var(--dp-transition), color var(--dp-transition), transform .1s ease; }
.dashboard-shell-host .dash-side-item:hover { transform: translateX(2px); }
.dashboard-shell-host .dash-side-item.active { box-shadow: inset 0 0 0 1px rgba(var(--d-accent-rgb), .35); }

.dashboard-shell-host .dash-btn { transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, filter .16s ease, background .16s ease; }
.dashboard-shell-host .dash-btn:active { transform: translateY(0) scale(.985); }

.dashboard-shell-host .module-header-meta .module-scope,
.dashboard-shell-host .module-header-meta .module-status {
  backdrop-filter: blur(4px);
  border: 1px solid rgba(var(--d-accent-rgb), .25);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 11.5px;
  font-weight: 700;
}

/* ---------- 5. États vides & erreurs ---------- */
.dashboard-shell-host .dash-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 46px 20px; text-align: center;
  border: 1.5px dashed var(--d-border);
  border-radius: var(--dp-radius-card);
  background: rgba(var(--d-accent-rgb), .03);
}
.dashboard-shell-host .dash-empty .big { font-size: 40px; filter: saturate(.9); }
.dashboard-shell-host .dash-empty p { max-width: 440px; line-height: 1.6; color: var(--d-dim); font-size: 13px; margin: 0; }

.dashboard-shell-host .dash-state-card.is-error {
  border-radius: var(--dp-radius-card);
  box-shadow: var(--dp-shadow-card);
}

/* ---------- 6. Scrollbar fine (sidebar, contenu) ---------- */
.dashboard-shell-host .dash-side::-webkit-scrollbar,
.dashboard-shell-host .dash-main::-webkit-scrollbar,
.dashboard-shell-host .modal-body::-webkit-scrollbar { width: 8px; }
.dashboard-shell-host .dash-side::-webkit-scrollbar-thumb,
.dashboard-shell-host .dash-main::-webkit-scrollbar-thumb,
.dashboard-shell-host .modal-body::-webkit-scrollbar-thumb { background: rgba(var(--d-accent-rgb), .28); border-radius: 99px; }
.dashboard-shell-host .dash-side::-webkit-scrollbar-track,
.dashboard-shell-host .dash-main::-webkit-scrollbar-track { background: transparent; }

/* ---------- 7. Mode clair v194 ---------- */
html.hx-light .dashboard-shell-host .dash-card {
  box-shadow: 0 6px 24px -14px rgba(30,34,60,.22);
}
html.hx-light .dashboard-shell-host .dash-card:hover {
  box-shadow: 0 14px 34px -16px rgba(30,34,60,.3);
  border-color: rgba(var(--d-accent-rgb), .5);
}
html.hx-light .dashboard-shell-host .dash-table tbody tr:hover { background: rgba(var(--d-accent-rgb), .06); }
html.hx-light .dashboard-shell-host .dash-empty { border-color: #d5d9e6; background: rgba(var(--d-accent-rgb), .04); }
html.hx-light .dashboard-shell-host .module-header-meta .module-scope,
html.hx-light .dashboard-shell-host .module-header-meta .module-status {
  border-color: rgba(var(--d-accent-rgb), .35);
}

/* ---------- 8. Mouvements réduits (cohérent avec le reste du site) ---------- */
@media (prefers-reduced-motion: reduce) {
  .dashboard-shell-host *,
  .dashboard-shell-host *::before,
  .dashboard-shell-host *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ════════════════════════════════════════════════════════════════
   🔧 AUDIT UI v197 — débordements, tailles et positions
   Corrige : rangées de types de tickets coupées (boutons 🗑 masqués),
   grille Embed qui déborde, boutons d'icônes réduits à 34px, cibles
   tactiles < 40px, titres/sélecteurs qui débordent sur mobile.
   ════════════════════════════════════════════════════════════════ */

/* 1) Dropdowns custom : ne débordent JAMAIS de leur conteneur */
.dd-host { max-width: 100%; min-width: 0; }

/* 2) Tickets — « Types de tickets » : les rangées de rôles staff et
   de questions occupent toute la largeur et se replient au lieu de
   faire déborder la carte (le bouton 🗑 était masqué par overflow) */
.setting-row > div { max-width: 100%; }
.setting-row > .t-roles,
.setting-row > .t-questions,
.setting-row > .t-staff {
  flex: 1 1 100%; max-width: 100%; min-width: 0;
}
.t-roles > div, .t-questions > div { flex-wrap: wrap; min-width: 0; max-width: 100%; }
.t-roles .dd-host, .t-questions .dd-host,
.t-roles .dash-select, .t-questions .dash-select { flex: 1 1 100%; min-width: 0; max-width: 100%; }
.t-roles .dash-input, .t-questions .dash-input { min-width: 0; max-width: 100%; flex: 1 1 200px; }
.t-roles > div .dash-btn, .t-questions > div .dash-btn { flex-shrink: 0; }

/* 3) Boutons d'icônes du haut de page : vraie cible tactile 40px
   (annule l'override à 34px de la couche v195) */
.dashboard-shell-host .dash-topbar-actions .dash-iconbtn,
.dash-iconbtn { width: 40px !important; min-width: 40px; height: 40px !important; min-height: 40px; }

/* 4) Navigation mobile : boutons ☰ / ▦ à 42px (confort pouce) */
.dashboard-shell-host .dash-mobile-navbtn { width: 42px !important; height: 42px !important; min-width: 42px; min-height: 42px; }

/* 5) Bouton « Retour » des modules */
.dashboard-shell-host .module-back { min-height: 40px; min-width: 44px; padding: 8px 13px; }

/* 6) Fermeture du sélecteur de serveurs */
.sp-close { width: 40px; height: 40px; min-width: 40px; min-height: 40px; }

/* 7) Petits boutons (suppression 🗑, etc.) : cible tactile minimale */
.dash-btn-sm { min-height: 38px; min-width: 40px; }

/* 8) Filtres Auto-Mod (pills) : hauteur confortable */
.am-filter { min-height: 34px; display: inline-flex; align-items: center; }

/* 9) Boutons « à marquer / marqué » des annonces */
.ca-mark { min-height: 38px; min-width: 40px; }

/* 10) Presets de couleurs de l'Embed Builder : cibles rondes larges */
.eb-preset { width: 40px; height: 40px; }
.eb-color-row input[type="color"] { height: 36px; }

/* 11) Grille de l'Embed Builder : les colonnes ne peuvent pas
   s'étendre au-delà du conteneur (1fr laissait les inputs élargir
   la carte de plus de 350px) */
.eb-wrap, .eb-editor-col, .eb-preview-col { min-width: 0; }
.eb-grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.eb-grid2 > * { min-width: 0; }
.eb-grid2 .setting-row { flex-wrap: wrap; }
.eb-grid2 .setting-row > .dash-label { flex: 1 1 100%; min-width: 0; }
.eb-grid2 .setting-row > input.dash-input,
.eb-grid2 .setting-row > .dash-select,
.eb-grid2 .setting-row > textarea.dash-input { width: 100%; flex: 1 1 100%; min-width: 0; max-width: 100%; }

/* 12) En-têtes de cartes : le texte se plie au lieu de pousser le
   contrôle (switch) hors de la carte */
.dash-card .card-head > * { min-width: 0; }
.dash-card .card-head h3,
.dash-card .card-head .desc { overflow-wrap: anywhere; }

/* 13) Titre et sous-titre de module : se plient sur mobile */
.dash-module-header { flex-wrap: wrap; }
.dash-module-header h1,
.dash-module-header .sub { min-width: 0; overflow-wrap: anywhere; }
.dash-module-header h1, .module-header-copy h1 { white-space: normal; }

/* 14) Interrupteurs (switch) : ne débordent pas des lignes flex */
label.switch { flex-shrink: 0; max-width: 100%; }

/* 15) Cases à cocher et radios : un peu plus grandes + couleur du thème */
input[type="checkbox"], input[type="radio"] {
  width: 20px; height: 20px; flex-shrink: 0;
  accent-color: var(--d-accent, #e07a5f); cursor: pointer;
}

/* 16) Noms de serveurs très longs : coupés proprement au lieu de
   pousser la carte (ellipsis avec titre complet au survol) */
.srv-card b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 20) Tiroir de navigation mobile : avatars de serveurs et fermeture
   à une vraie taille tactile (Discord utilise 48px) */
.dash-mobile-server-item { width: 42px !important; height: 42px !important; flex-basis: 42px !important; }
.dash-mobile-close { width: 40px !important; height: 40px !important; min-width: 40px !important; }

/* ============================================================
   🔧 AUDIT UI v199 — HUB FONDATEUR (espace privé)

   ============================================================ */
.admin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

.admin-tab.active { background: rgba(224,122,95,.14); border-color: rgba(224,122,95,.6); color: #e07a5f; }

html.hx-light .admin-tab { background: #fff; border-color: #e3e3ea; color: #5a5f6b; }
html.hx-light .admin-tab.active { background: rgba(224,122,95,.12); border-color: rgba(224,122,95,.55); color: #c0604a; }
html.hx-light .activity-item { background: #fff; border-color: #e3e3ea; }
/* Boutons de la page admin : cohérence avec le style public */

/* 🔗 Puces de salon dans l'aperçu Discord (style Discord) */
.dc-mention {

/* ════════════════════════════════════════════════════════════════
   🔧 v206 — anti-images cassées + sélecteurs lisibles
   ════════════════════════════════════════════════════════════════ */

/* 🖼️ Avatar de secours : remplace proprement toute image qui n'a pas pu
   charger (CDN Discord injoignable, avatar supprimé, URL invalide…) —
   l'icône « image cassée » du navigateur ne doit jamais apparaître. */
.img-fb {
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; vertical-align: middle; overflow: hidden;
  background: linear-gradient(135deg, #3b3f5c, #23252f);

.img-fb.is-round { border-radius: 50%; }
.img-fb img-fb-t { display: block; }

/* Sélection visible dans les menus déroulants (contraste renforcé) */
.dd-option.is-selected {
  background: rgba(var(--d-accent-rgb), .24);
  box-shadow: inset 0 0 0 1.5px rgba(var(--d-accent-rgb), .5);
}

.dd-option.is-selected .dd-check {

}

html.hx-light .dd-option.is-selected .dd-check { background: #e07a5f; color: #fff; border-radius: 6px; }

/* Icônes d'options du menu déroulant : les emojis (💬 salon, 🛡️ rôle,

.dd-opt-ico .dd-emoji { font-size: 15px; line-height: 1; }
.dd-opt-ico .dd-letter { font-size: 12px; font-weight: 800; color: var(--d-text); }
/* Lignes sans icône (placeholder « — Choisir… — »…) : le texte reste aligné

.dd-option.no-ico .dd-opt-txt b { color: var(--d-dim); font-weight: 600; }

/* ============================================================
   🎨 v209 — Finitions : tokens d'arrondis + une seule « surface
   Discord » pour TOUS les aperçus (.dc-preview, .embed-box,
   .adv-discord-preview, .ca-discord-preview, .eb-discord).
   Avant : chaque module avait son rayon (6 à 13 px) → aperçus
   incohérents d'un module à l'autre. Maintenant : --r-sm partout.
   ============================================================ */
:root {
  --r-xs: 8px;
  --r-sm: 10px;   /* champs, petites cartes */
  --r-md: 14px;   /* cartes principales */
  --r-lg: 18px;   /* modales / grandes feuilles */
  --r-pill: 999px;
  --dc-shell: #313338;   /* fond « salon Discord » */
  --dc-border: #1e1f22;
}
:is(.dc-preview, .embed-box, .adv-discord-preview, .ca-discord-preview, .eb-discord) {
  border-radius: var(--r-sm);
  border-color: var(--dc-border);
}

/* ============================================================
   v244 — Anti-nuke : limites par type d'action.
   Trois sélecteurs (seuil, fenêtre, sanction) par type surveillé.

   Pourquoi des classes et pas des styles inline : un style inline ne
   peut PAS être surchargé par une media query. L'ancienne ligne était
   en `style="grid-template-columns:1fr auto auto"`, donc figée : sur un
   écran de 360 px les deux cases numériques prenaient ~180 px et il ne
   restait que ~140 px pour le libellé et son texte d'aide.
   ============================================================ */
/* ============================================================
   v248 — Grille de petits champs « libellé + contrôle ».

   Remplace des grilles écrites en STYLE INLINE, donc figées : un style inline
   ne peut être surchargé par aucune media query, exactement le piège déjà
   rencontré pour .nk-limit.

   Le plancher de colonne doit tenir compte de ce que fabrique
   Dashboard.layoutSettingRows : il transforme chaque cellule
   « <label class="dash-label"> + <input|select> » en .setting-row, qui met le
   libellé et le contrôle CÔTE À CÔTE. Or le champ a un min-width de 84 px.

   Avec l'ancien plancher inline de 140 px, mesuré à 901 px de large (contenu
   réel 581 px une fois la barre latérale déduite) : auto-fit posait 3 colonnes
   de 187 px, chacune pour 204 px de contenu réel — soit 17 px de débordement
   par colonne. Un plancher à 210 px fait passer auto-fit à 2 colonnes de 285 px
   et le débordement disparaît.
   ============================================================ */
.dashboard-shell-host .dash-fields-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
}
/* Téléphone : une seule colonne, plus rien n'est compressé. */
@media (max-width: 520px) {
  .dashboard-shell-host .dash-fields-grid { grid-template-columns: minmax(0, 1fr); }
}

.dashboard-shell-host .nk-limit-list { display: grid; gap: 8px; }
.dashboard-shell-host .nk-group-title { margin-top: 14px; }
.dashboard-shell-host .nk-group-title:first-child { margin-top: 0; }

.dashboard-shell-host .nk-limit {
  display: grid;
  /* Le libellé prend le reste ; les trois champs ont une largeur plancher
     assez large pour que « Quarantaine » et « 10 actions » ne soient pas
     tronqués. minmax(0,…) évite le débordement classique des grilles CSS. */
  grid-template-columns: minmax(0, 1.7fr) repeat(3, minmax(112px, 0.9fr));
  gap: 10px;
  align-items: end;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, .10);
  border-radius: 10px;
}

.dashboard-shell-host .nk-limit-label { display: grid; gap: 2px; min-width: 0; }
.dashboard-shell-host .nk-limit-name { font-size: 13px; line-height: 1.35; }
.dashboard-shell-host .nk-limit-help { margin: 0; font-size: 12px; line-height: 1.45; }

.dashboard-shell-host .nk-limit-field { display: grid; gap: 3px; min-width: 0; }
.dashboard-shell-host .nk-limit-field > .desc { margin: 0; font-size: 11px; line-height: 1.2; }
.dashboard-shell-host .nk-limit-field .dash-select {
  width: 100%; min-width: 0; margin: 0;
  font-size: 12px; text-transform: none; letter-spacing: 0;
}

/* Tablette / petit écran : le libellé passe sur toute la largeur, les trois
   champs se répartissent dessous. */
@media (max-width: 900px) {
  .dashboard-shell-host .nk-limit { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dashboard-shell-host .nk-limit-label { grid-column: 1 / -1; }
}

/* Téléphone : une seule colonne, plus rien n'est compressé. */
@media (max-width: 520px) {
  .dashboard-shell-host .nk-limit { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px; }
  .dashboard-shell-host .nk-limit-help { font-size: 11.5px; }
}

/* v244 — Grille de statistiques dense, utilisée DANS une carte.
   `.dash-stats` seule est déjà responsive (auto-fit + surcharge mobile en
   2 colonnes), mais elle porte une marge basse pensée pour un début de page.
   La variante dense reprend exactement le même comportement sans la marge.
   Remplace un `grid-template-columns:repeat(3,1fr)` inline qui, lui, ne
   pouvait pas être corrigé sur mobile et faisait déborder le libellé
   « Refusées (file pleine) ». */
.dashboard-shell-host .dash-stats-dense { margin-bottom: 0; gap: 8px; }
.dashboard-shell-host .dash-stats-dense .dash-stat { padding: 10px; border-radius: 10px; }
.dashboard-shell-host .dash-stats-dense .dash-stat .val { font-size: 19px; }
.dashboard-shell-host .dash-stats-dense .dash-stat .lbl { font-size: 11.5px; line-height: 1.3; }

/* Le sélecteur de sanction par type peut porter un libellé long
   (« Global — Quarantaine ») : on l'empêche de déborder de sa cellule. */
.dashboard-shell-host .nk-limit-field .dash-select {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Téléphone : les libellés d'aide passent à 11,5 px pour rester lisibles
   sans occuper trois lignes. Aucune règle mobile ne le faisait avant. */
@media (max-width: 520px) {
  .dashboard-shell-host .am-threshold-controls .dash-input,
  .dashboard-shell-host .am-threshold-controls .dash-select { width: 100%; flex: 1 1 100%; }
  .dashboard-shell-host .am-threshold-controls { width: 100%; }
}

/* ============================================================
   v244 — Plancher de lisibilité sur mobile.

   Audit mesuré dans Chromium à 360 px : plusieurs textes porteurs
   de PHRASES tombaient entre 9,58 px et 10,5 px. Sur un téléphone
   c'est en dessous du seuil de confort (Apple et Google indiquent
   11 px minimum pour du texte secondaire).

   Le plancher ne s'applique QUE sous 700 px : le rendu sur grand
   écran n'est pas modifié. Les libellés en majuscules (.dash-label,
   11 px) et les badges imitant Discord (8 px) sont volontairement
   exclus — ce sont des choix de design assumés, pas des accidents.
   ============================================================ */
@media (max-width: 700px) {
  .dashboard-shell-host .ov-intro-health small,
  .dashboard-shell-host .ov-eyebrow,
  .dashboard-shell-host .ov-side-heading span,
  .dashboard-shell-host .ov-quick-label,
  .dashboard-shell-host .ov-access-bar .ov-quick-label,
  .dashboard-shell-host .ov-progress-copy span,
  .dashboard-shell-host .ov-home-feed .feed-time,
  .dashboard-shell-host .module-scope,
  .dashboard-shell-host .module-status,
  .dashboard-shell-host .am-threshold-box > small,
  .dashboard-shell-host .am-threshold-controls span,
  .dashboard-shell-host .am-rule-setting small,
  .dashboard-shell-host .am-rule-state,
  .dashboard-shell-host .adv-category-help {
    font-size: 11px;
  }
}

/* Téléphone — cibles tactiles.
   Mesuré dans Chromium à 360 px : les filtres de Modération (.am-filter,
   « Tous / 🤖 Auto-Mod / 🛡️ Staff / 🕘 24 h ») tombaient à 34 px de haut et
   les boutons de formatage des Annonces (.ca-mark, « B / I / U / S ») à 38 px.
   Apple et Google recommandent 44 px ; on monte à 40 px, ce qui reste
   compatible avec l'alignement horizontal existant.

   Le second membre de la media query vise les ÉCRANS TACTILES quelle que
   soit leur largeur (tablette en mode paysage, par exemple) : à 768 px les
   13 cibles trop petites réapparaissaient sinon. Le même idiome
   (hover: none) and (pointer: coarse) est déjà utilisé plus haut dans ce
   fichier. Un poste à souris n'est pas concerné : le rendu desktop reste
   strictement inchangé. */
@media (max-width: 700px), (hover: none) and (pointer: coarse) {
  .dashboard-shell-host .am-filter { min-height: 40px; }
  .dashboard-shell-host .ca-mark { min-height: 40px; min-width: 40px; }
}

/* ------------------------------------------------------------
   v244 — Conflit de spécificité sur la barre d'accès rapides.

   L'élément porte DEUX classes : class="ov-quick-actions ov-access-bar".
   Deux règles visaient donc le même élément, à spécificité identique :
     • L3996  @media (max-width: 520px)  .ov-access-bar     → 1 colonne
     • L4368  @media (max-width: 700px)  .ov-quick-actions  → 2 colonnes
   Comme L4368 vient APRÈS dans le fichier et que les deux media queries
   sont vraies à 360 px, c'est elle qui gagnait. Résultat mesuré :
   grid-template-columns: 169px 169px, et « Identité du bot » rogné de 9 px.

   Le sélecteur composé ci-dessous monte la spécificité (0,3,1) et est placé
   en fin de fichier : la colonne unique voulue sur téléphone est rétablie.
   ------------------------------------------------------------ */
@media (max-width: 520px) {
  .dashboard-shell-host .ov-quick-actions.ov-access-bar { grid-template-columns: 1fr; }
  /* Même famille : le <small> de ces boutons était à 10 px. */
  .dashboard-shell-host .ov-access-bar .ov-quick-action small,
  .dashboard-shell-host .ov-quick-action small { font-size: 11px; }
}

/* ============================================================
   v245 — « En savoir plus » : textes d'explication repliés.

   <details>/<summary> natif : pas de JavaScript pour ouvrir/fermer,
   accessible au clavier (Entrée et Espace), annoncé correctement par
   les lecteurs d'écran, et le texte replié reste indexable par la
   recherche dans la page (Ctrl+F).

   Le repli est appliqué par Dashboard.plierTextesLongs sur une LISTE
   BLANCHE de classes d'explication, à partir de 120 caractères. Les
   avertissements, les libellés de formulaire, les aperçus et les
   conteneurs de champs ne sont jamais repliés.
   ============================================================ */
.dash-details { margin: 0 0 14px; }
/* Le texte replié portait déjà sa propre marge basse (.dash-card .desc).
   Une fois à l'intérieur du <details>, cette marge ne compte plus quand
   c'est fermé : c'est le <details> qui reprend l'espacement. */
.dash-details > .desc,
.dash-details > .sub { margin-bottom: 0; }
.dash-details[open] { padding-bottom: 2px; }

.dash-details > summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 0;
  color: var(--d-accent);
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
  list-style: none;
  -webkit-user-select: none;
  user-select: none;
  border-radius: 7px;
  transition: color .15s ease;
}
.dash-details > summary::-webkit-details-marker { display: none; }
.dash-details > summary::before {
  content: '▸';
  display: inline-block;
  font-size: 10px;
  transition: transform .16s ease;
}
.dash-details[open] > summary::before { transform: rotate(90deg); }
.dash-details > summary:hover { color: var(--d-accent2, var(--d-accent)); text-decoration: underline; }
.dash-details > summary:focus-visible {
  outline: 2px solid rgba(var(--d-accent-rgb), .6);
  outline-offset: 2px;
}
/* Une fois ouvert, le texte reprend sa couleur normale d'explication. */
.dash-details[open] > .desc,
.dash-details[open] > .sub { margin-top: 8px; }

html.hx-light .dash-details > summary { color: #b3543d; }
html.hx-light .dash-details > summary:hover { color: #8f3f2c; }

/* Écran tactile : la cible doit rester confortable, MAIS un « En savoir plus »
   de 40 px de haut annule le gain du repli — mesuré : replier 90 blocs ne
   faisait alors gagner qu'un seul écran sur 77, parce que chaque lien replié
   coûtait presque autant que le texte qu'il cachait. 32 px garde une cible
   correcte (la largeur, elle, reste grande : tout le libellé est cliquable). */
@media (max-width: 700px), (hover: none) and (pointer: coarse) {
  .dash-details > summary { min-height: 32px; padding: 7px 0; }
}

/* ============================================================
   v245 — Cartes pliables.

   Aucune restructuration du DOM : on ajoute une classe sur la carte et on
   masque par CSS. Six règles existantes ciblent les enfants DIRECTS d'une
   carte (.dash-card > .card-actions, .dash-card[data-dash-card] > .dash-input…)
   ; emballer le contenu dans un conteneur les aurait toutes cassées.

   Tout est ouvert par défaut (choix utilisateur). Le repli est mémorisé le
   temps de la session.
   ============================================================ */
.card-head-pliable { cursor: pointer; position: relative; }
.card-head-pliable:hover .card-fold { opacity: 1; border-color: rgba(var(--d-accent-rgb), .55); }

.card-fold {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
  padding: 0;
  color: var(--d-dim);
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--d-border);
  border-radius: 8px;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  opacity: .72;
  transition: opacity .15s ease, transform .18s ease, border-color .15s ease, color .15s ease;
}
.card-fold:hover { color: var(--d-accent); }
.card-fold:focus-visible { outline: 2px solid rgba(var(--d-accent-rgb), .6); outline-offset: 2px; opacity: 1; }
.card-fold span { display: block; transition: transform .18s ease; }

/* Carte repliée : on masque tout SAUF l'en-tête. `!important` parce que des
   règles existantes imposent display sur certains enfants (.card-actions,
   grilles, flex) et passeraient sinon après celle-ci. */
.dash-card.is-folded > *:not(.card-head) { display: none !important; }
.dash-card.is-folded > .card-head { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.dash-card.is-folded .card-fold span { transform: rotate(-90deg); }
/* En-tête replié : le titre seul suffit, la description suivrait sinon. */
.dash-card.is-folded .card-head .desc { display: none; }
.dash-card.is-folded { padding-bottom: 14px; }

html.hx-light .card-fold { background: #fff; border-color: #d7e0ee; color: #6b7a92; }
html.hx-light .card-fold:hover { color: #b3543d; }

/* Écran tactile : le chevron est une cible comme une autre, donc 40 px — le
   plancher retenu en v244. À 32 px, l'audit mesurait 57 cibles trop petites
   (une par carte). Toute la barre de titre reste cliquable en plus. */
@media (max-width: 700px), (hover: none) and (pointer: coarse) {
  .card-fold { width: 40px; height: 40px; opacity: 1; }
}

/* ---------- v252 — PC étroit (701-900 px, pointeur fin) : rail d'icônes ----------
   Un PC dont la largeur CSS est réduite (échelle d'affichage Windows, fenêtre
   étroite) garde sa disposition PC, mais la barre latérale pleine largeur y
   mangerait tout le contenu. Comme Discord ou Dyno, elle se replie en rail
   d'icônes : 64 px au lieu de 256, et le contenu retrouve ~190 px.
   Périmètre VOLONTAIREMENT strict : pointeur fin UNIQUEMENT (un téléphone ou
   une tablette sans souris reste en mobile), et seulement entre 701 et 900 px
   (au-delà, sidebar normale ; en dessous, mobile). */
@media (pointer: fine) and (min-width: 701px) and (max-width: 900px) {
  .dashboard-shell-host .dash-side { width: 64px; flex: 0 0 64px; }
  .dashboard-shell-host .dash-side-brand { justify-content: center; margin: 6px 0 10px; padding: 0; }
  .dashboard-shell-host .dash-side-brand-copy,
  .dashboard-shell-host .dash-side-section,
  .dashboard-shell-host .dash-server-card .srv-txt,
  .dashboard-shell-host .dash-side .scroll-hint,
  .dashboard-shell-host .dash-side-foot { display: none; }
  .dashboard-shell-host .dash-server-card { justify-content: center; padding: 6px 0; margin: 0 6px 8px; }
  /* Le libellé est un nœud de texte nu : font-size 0 le fait disparaître sans
     toucher au markup, et l'icône retrouve sa taille normale. */
  .dashboard-shell-host .dash-side-item { font-size: 0; gap: 0; justify-content: center; padding: 6px 0; margin: 2px 7px; width: calc(100% - 14px); }
  .dashboard-shell-host .dash-side-item .ico { font-size: 16px; }
}

/* ---------- v253 — OS de bureau : disposition PC garantie (481-900 px) ----------
   Ultime filet, après trois correctifs fondés sur des mesures (largeur, tactile,
   hauteur) que certains PC fauxent — échelle d'affichage Windows, écran tactile
   déclaré comme pointeur principal… Ici on ne mesure plus : si le système est
   un OS de bureau (classe hx-os-pc posée par index.html), la coquille MOBILE
   (hamburger, tiroirs, barre basse) est neutralisée entre 481 et 900 px et la
   barre latérale revient en rail d'icônes. Au-delà de 900 px ce bloc ne fait
   rien (le PC y est déjà en PC) ; sous 481 px même un PC passe en mobile, une
   fenêtre si petite n'ayant pas la place d'une barre latérale.
   Android / iPhone / iPad n'ont pas la classe : strictement inchangés. */
/* ================================================================
   v254 — UN OS DE BUREAU = COQUILLE PC À TOUTES LES LARGEURS ≥ 481 px
   ----------------------------------------------------------------
   Le bloc mobile (21 requêtes médias) contient une clause SANS limite
   de largeur : « (hover: none) and (pointer: coarse) and (max-height:
   800px) and (any-pointer: coarse) ». Sur un PC portable tactile dont
   la hauteur utile tombe sous 800 px (1366×768, ou 1080p à 150 %),
   cette clause fait basculer TOUTE la page en mobile, même plein écran
   à 1 920 px — c'est le cas que les v250→v253 ne couvraient pas, leurs
   correctifs s'arrêtant à 900 px.
   Donc : dès 481 px, sur un OS de bureau (classe hx-os-pc posée par
   index.html d'après le user-agent), on neutralise la coquille mobile
   à TOUTES les largeurs, puis on choisit le calibre de la barre
   latérale — rail d'icônes 481-900 px, barre complète au-delà.
   Sans la classe hx-os-pc (Android, iPhone, iPad) : rien ne change.
   ================================================================ */

/* --- Palier A : socle commun, toutes largeurs ≥ 481 px --- */
@media (min-width: 481px) {
  /* Le bloc mobile empile la coquille en colonne (onglets horizontaux) :
     on la remet en ligne, et la barre latérale debout. */
  html.hx-os-pc .dashboard-shell-host .dash-shell { flex-direction: row; }
  html.hx-os-pc .dashboard-shell-host .dash-side {
    display: flex; flex-shrink: 0; flex-direction: column;
    overflow-x: hidden; overflow-y: auto;
    position: sticky; top: 56px; height: calc(100vh - 56px); transform: none;
    border-right: 1px solid var(--d-border); border-bottom: none;
  }
  /* Restes du bandeau d'onglets mobile sur les entrées de menu. */
  html.hx-os-pc .dashboard-shell-host .dash-side-item {
    flex: 0 0 auto; min-height: 0; white-space: normal; border-bottom: none;
  }
  html.hx-os-pc .dashboard-shell-host .dash-main { padding: 22px 26px 60px; }
  html.hx-os-pc .dashboard-shell-host .dash-topbar {
    margin: 0; padding: 10px 14px;
    display: flex; flex-direction: row; align-items: center; gap: 10px;
  }
  html.hx-os-pc .dashboard-shell-host .dash-topbar-actions { margin-left: auto; display: flex; align-items: center; }
  /* Le fil d'ariane du haut, masqué par le bloc mobile à toutes largeurs. */
  html.hx-os-pc .dashboard-shell-host .dash-crumb { display: flex; }
  html.hx-os-pc .dashboard-shell-host .dash-side-brand { display: flex; }
  html.hx-os-pc .dashboard-shell-host .dash-side-brand-copy { display: flex; }
  html.hx-os-pc .dashboard-shell-host .dash-server-card .srv-txt { display: flex; }
  html.hx-os-pc .dashboard-shell-host .dash-side-section { display: block; }
  html.hx-os-pc .dashboard-shell-host .dash-side-foot { display: block; }
  /* Le chrome exclusivement mobile n'existe pas sur OS de bureau. */
  html.hx-os-pc .dashboard-shell-host .dash-mobile-bar,
  html.hx-os-pc .dashboard-shell-host .dash-bnav,
  html.hx-os-pc .dashboard-shell-host .dash-mobile-drawer,
  html.hx-os-pc .dashboard-shell-host .dash-mobile-backdrop,
  html.hx-os-pc .dashboard-shell-host .scroll-hint { display: none !important; }
}

/* --- v255 : sur OS de bureau, le VISAGE v241 du tableau de bord ---
   L'utilisateur compare toujours son souvenir de la v241 : sidebar de
   278 px (258 sous 1200 px) à marque centrée et avatar 82 px, entrées de
   menu 13,5 px paddées 24 px, fil d'ariane visible, barre d'outils de
   48 px soulignée d'un trait, zone de travail paddée 24/42 px.
   On ne restaure QUE la GÉOMÉTRIE : les couleurs restent celles du thème

  background: linear-gradient(135deg, var(--d-accent), var(--d-accent2));
  border: none; color: #fff; box-shadow: 0 3px 14px rgba(var(--d-accent-rgb), .35);
}
html.hx-os-pc .dashboard-shell-host .dash-btn-primary:hover {
  filter: brightness(1.1); box-shadow: 0 5px 18px rgba(var(--d-accent-rgb), .45);
}
html.hx-os-pc .dashboard-shell-host .dash-btn-danger {
  background: rgba(237,66,69,.12); color: #ff8a8d; border-color: rgba(237,66,69,.4);
}
html.hx-os-pc .dashboard-shell-host .dash-stat {
  background: var(--d-card); border: 1px solid var(--d-border); border-radius: 14px;
  padding: 16px 18px; background: var(--d-card) !important;
}
html.hx-os-pc .dashboard-shell-host .dash-table th {
  text-align: left; color: var(--d-dim); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px; padding: 8px 10px;
  border-bottom: 1px solid var(--d-border);
}
html.hx-os-pc .dashboard-shell-host .dash-table tbody tr:hover td {
  background: rgba(var(--d-accent-rgb), .05);
}

/* --- v258 (aperçu) : barre d'actions et badge compte sur PC ---
   Le bloc mobile masquait la barre d'actions en !important : sur un PC
   tombant dans ses clauses, le thème 🌓, la couleur 🎨, la cloche, le
   rafraîchissement et le badge du bot disparaissaient. Sur OS de bureau,
   on la rend — et le badge du compte connecté (photo, pseudo, bouton de
   déconnexion) y prend place, comme dans le souvenir de la v241. */
html.hx-os-pc .dashboard-shell-host .dash-topbar-actions {
  display: flex !important; width: auto; flex-wrap: wrap; justify-content: flex-end;
}
.dash-account-chip {
  display: flex; align-items: center; gap: 8px; padding: 4px 6px;
  border: 1px solid var(--d-border); border-radius: 10px; background: var(--d-card);
}
.dash-account-chip img,
.dash-account-chip .acc-fallback { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%; object-fit: cover; }
.dash-account-chip .acc-fallback {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--d-card2); color: var(--d-text); font-weight: 800; font-size: 13px;
}
.dash-account-chip .chip-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.dash-account-chip .chip-txt b {
  font-size: 12.5px; color: var(--d-text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;
}
.dash-account-chip .chip-txt small { font-size: 10.5px; color: var(--d-dim); }
.dash-account-chip .dash-iconbtn { width: 30px; height: 30px; }

/* ============================================================
   v313 — Sélecteurs des modules (après choix du serveur)
   Libellé au-dessus, barre pleine largeur (~44 px), menu aussi
   large que le champ. Interrupteurs inchangés. Mobile + PC :
   aucun débordement (max-width 100 %, min-width 0).
   ============================================================ */
.dashboard-shell-host #dash-content,
.dashboard-shell-host .dash-card,
.dashboard-shell-host .setting-row {
  min-width: 0;
  max-width: 100%;
}

.dashboard-shell-host .setting-row:not(:has(> label.switch)) {
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 8px;
}

.dashboard-shell-host .setting-row:not(:has(> label.switch)) > .dash-label {
  flex: 0 0 auto;
  width: 100%;
  max-width: 100%;
  min-width: 0;
}

.dashboard-shell-host .setting-row:not(:has(> label.switch)) > .dash-select,
.dashboard-shell-host .setting-row:not(:has(> label.switch)) > input.dash-input,
.dashboard-shell-host .setting-row:not(:has(> label.switch)) > textarea.dash-input,
.dashboard-shell-host .setting-row:not(:has(> label.switch)) > .dash-roles-multi,
.dashboard-shell-host .setting-row:not(:has(> label.switch)) > .discord-multi-host,
.dashboard-shell-host .setting-row:not(:has(> label.switch)) > .dd-host,
.dashboard-shell-host .setting-row:not(:has(> label.switch)) > div {
  width: 100%;
  flex: 1 1 auto;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.dashboard-shell-host .dd-host,
.dashboard-shell-host .discord-multi-host {
  max-width: 100%;
  min-width: 0;
}

.dashboard-shell-host .dd-trigger {
  min-height: 44px;
  box-sizing: border-box;
  max-width: 100%;
}

.dashboard-shell-host .dd-panel {
  max-width: calc(100vw - 20px);
  box-sizing: border-box;
}

/* Multi : puces + bouton « ＋ » DANS la même barre (DraftBot). */
.dashboard-shell-host .discord-multi-picker {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 8px;
  border: 1px solid var(--d-border-soft, var(--d-border));
  border-radius: var(--d-radius-control, 10px);
  background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 65%), var(--d-card2);
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}
.dashboard-shell-host .discord-multi-picker .discord-multi-values {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}
.dashboard-shell-host .discord-multi-picker .dd-add-btn {
  width: auto;
  flex: 0 0 auto;
  min-height: 32px;
  min-width: 32px;
  padding: 4px 12px;
  border-radius: 999px;
  justify-content: center;
}
.dashboard-shell-host .discord-multi-picker .discord-multi-empty {
  padding: 0;
}

@media (max-width: 700px) {
  .dashboard-shell-host .dd-trigger {
    min-height: 48px;
    font-size: 16px;
  }
  .dashboard-shell-host .discord-multi-picker {
    min-height: 48px;
  }
}

/* ============================================================
   v359 — Espace fondateur : console Slate & Clay
   Même langage visuel que le centre serveur, avec une hiérarchie
   dédiée aux indicateurs, à la santé et à l'activité plateforme.
   ============================================================ */
.admin-platform-page {

  --admin-surface-raised: #313338;
  --admin-surface-soft: #40444b;
  --admin-border: #4f545c;

  --admin-text: #f2f3f5;
  --admin-muted: #b5bac1;
  --admin-subtle: #949ba4;
  --admin-accent: #e07a5f;
  --admin-accent-soft: rgba(224,122,95,.12);
  --admin-good: #57f287;
  --admin-bad: #ed747a;
  --admin-warn: #f0c66d;

  max-width: 1280px;

body:has(.admin-platform-page),

  margin-bottom: 5px;
  color: var(--admin-accent);

}

.admin-platform-page .admin-overview-copy p { margin: 5px 0 0; color: var(--admin-muted); font-size: 12.5px; line-height: 1.45; }

.admin-platform-page .admin-hero-status.is-offline .admin-hero-status-mark i { background: var(--admin-bad); box-shadow: 0 0 0 3px rgba(237,116,122,.12); }

.admin-platform-page .admin-metrics-section { min-width: 0; }

.admin-platform-page .admin-overview-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); align-items: start; gap: 13px; }

.admin-platform-page .admin-activity-count { color: var(--admin-muted); font-size: 11px; font-weight: 750; }

.admin-platform-page .admin-health-copy { display: block; min-width: 0; }

.admin-platform-page .admin-action-primary { flex: 1 1 auto; color: #fff; background: var(--admin-accent); border-color: var(--admin-accent) !important; }
