name: CI — Hoxera

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Audit de toutes les dépendances
        run: npm audit --audit-level=low

      - name: Vérification syntaxe, secrets et suite complète
        run: bash scripts/check.sh
