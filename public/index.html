<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f15" />
  <title>Hoxera — Le bot de ton serveur Discord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/nexora-robot-mark-192.png" />
  <link rel="icon" href="/icons/nexora-robot-mark.png" />
  <link rel="stylesheet" href="/css/style.css?v=194" />
  <link rel="stylesheet" href="/css/dashboard.css?v=194" />
</head>
<body>
  <div id="app"></div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    // ☀️/🌙 Thème appliqué AVANT le rendu (pas de flash) : choix mémorisé, sinon réglage système
    try {
      const t = localStorage.getItem('hx-theme');
      if (t === 'light' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.add('hx-light');
      }
    } catch {}
  </script>
  <script src="/js/app.js?v=194"></script>
  <script src="/js/editor.js?v=194"></script>
  <script src="/js/views.js?v=194"></script>
  <script src="/js/public.js?v=194"></script>
  <script src="/js/dashboard.js?v=194"></script>
  <script>
    // Mode app installable (PWA) + MISE À JOUR AUTOMATIQUE :
    // dès qu'une nouvelle version du site est installée, la page se
    // recharge une fois toute seule — plus besoin de vider le cache.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          // Vérifie une nouvelle version : toutes les 30 min ET au retour sur l'onglet
          setInterval(() => reg.update().catch(() => {}), 30 * 60000);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        } catch {}
      });
      let reloadedOnce = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadedOnce) return;
        reloadedOnce = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
