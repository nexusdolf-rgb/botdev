<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f15" />
  <title>Hoxera — Le bot de ton serveur Discord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235865F2'/%3E%3Cstop offset='1' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ccircle cx='34' cy='42' r='9' fill='white'/%3E%3Ccircle cx='66' cy='42' r='9' fill='white'/%3E%3Crect x='22' y='58' width='56' height='10' rx='5' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css?v=138" />
  <link rel="stylesheet" href="/css/dashboard.css?v=138" />
</head>
<body>
  <div id="app"></div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script>
    // ☀️/🌙 Thème appliqué AVANT le rendu (pas de flash) : choix mémorisé, sinon réglage système
    try {
      const t = localStorage.getItem('hx-theme');
      if (t === 'light' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.add('hx-light');
      }
    } catch {}
  </script>
  <script src="/js/app.js?v=138"></script>
  <script src="/js/editor.js?v=138"></script>
  <script src="/js/views.js?v=138"></script>
  <script src="/js/public.js?v=138"></script>
  <script src="/js/dashboard.js?v=138"></script>
  <script>
    // Mode app installable (PWA) + MISE À JOUR AUTOMATIQUE :
    // dès qu'une nouvelle version du site est installée, la page se
    // recharge une fois toute seule — plus besoin de vider le cache.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          // Vérifie une nouvelle version : toutes les 30 min ET au retour sur l'onglet
          setInterval(() => reg.update().catch(() => {}), 30 * 60000);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        } catch {}
      });
      let reloadedOnce = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadedOnce) return;
        reloadedOnce = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
