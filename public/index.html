  <!-- 🏷️ v364 : l'avatar du bot est demande des le HTML. La barre du haut
       gauche le trouve deja charge, au lieu de peindre un rond vide puis la
       photo une fois le JavaScript demarre. -->
  <link rel="preload" href="/api/public/bot-avatar" as="image" />

<body>
  <div id="app"></div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    // v253 : « PC ou mobile » décidé par le SYSTÈME D'EXPLOITATION, pas par des
    // mesures que le navigateur peut fausser (échelle d'affichage Windows,
    // écran tactile déclaré pointeur principal…). Un Windows / Mac / Linux de
    // bureau porte la classe hx-os-pc et garde la disposition PC ; un Android,
    // iPhone, iPad (y compris déguisé en Mac) reste en mobile. Appliqué avant
    // le premier rendu pour ne pas flasher une mauvaise mise en page.
    try {
      const ua = navigator.userAgent;
      const osMobile = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Silk/.test(ua);
      const ipadEnMac = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      const osPc = /Windows NT|Macintosh|X11|Linux|CrOS/.test(ua) && !osMobile && !ipadEnMac;
      if (osPc) document.documentElement.classList.add('hx-os-pc');
    } catch {}
  </script>
  <script>
    // /🌙 Thème appliqué AVANT le rendu (pas de flash) : choix mémorisé, sinon réglage système
    try {
      const t = localStorage.getItem('hx-theme');
      const clair = t === 'light' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      if (clair) document.documentElement.classList.add('hx-light');
      // v364 — la couleur de la barre du navigateur (statut, en-tete mobile)
      // doit etre celle du fond REEL du theme : sinon, en theme clair, le
      // bandeau du haut arrive bleu nuit puis blanchit sous les yeux.
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', clair ? '#f2f3f8' : '#080b12');
    } catch {}
  </script>
  <script src="/js/app.js?v=369"></script>
  <script src="/js/editor.js?v=369"></script>
  <script src="/js/views.js?v=369"></script>
  <script src="/js/public.js?v=369"></script>
  <script src="/js/dashboard.js?v=369"></script>
  <script>
    // Mode app installable (PWA) + MISE À JOUR AUTOMATIQUE :
    // dès qu'une nouvelle version du site est installée, la page se
    // recharge une fois toute seule — plus besoin de vider le cache.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          // Vérifie une nouvelle version : toutes les 30 min ET au retour sur l'onglet
          setInterval(() => reg.update().catch(() => {}), 30 * 60000);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        } catch {}
      });
      let reloadedOnce = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadedOnce) return;
        reloadedOnce = true;
        window.location.reload();
      });
    }
  </script>
</body>
